<mat-sidenav-container class="layout">
  <mat-sidenav
    class="sidebar"
    [mode]="isWide() ? 'side' : 'over'"
    [opened]="isWide()"
    [fixedInViewport]="!isWide()"
  >
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <h3>Hoot</h3>
      </div>

      <nav class="sidebar-nav">
        @if (auth.isLoggedIn()) {
          <a
            class="nav-btn"
            routerLink="/"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Overview
          </a>

          @for (organization of organizations(); track organization) {
            <a
              class="nav-btn nav-organization"
              [routerLink]="['/orgs', organization]"
              routerLinkActive="active-link"
            >
              {{ organization }}
            </a>
          }

          <a class="nav-btn" routerLink="/profile" routerLinkActive="active-link">Profile</a>
        } @else {
          <a class="nav-btn" routerLink="/login" routerLinkActive="active-link">Login</a>
        }
      </nav>

      @if (auth.isLoggedIn()) {
        <div class="logout">
          <button class="nav-btn danger" (click)="logout()">Logout</button>
        </div>
      }
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content-area">
    @if (!isWide()) {
      <mat-toolbar class="top-bar">
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          (click)="openNavigation()"
        >
          <!-- Material Symbols "menu", Outlined, weight 400 -->
          <svg class="icon" viewBox="0 -960 960 960" aria-hidden="true" focusable="false">
            <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
          </svg>
        </button>
        <span class="top-bar-title">Hoot</span>
      </mat-toolbar>
    }
    <main class="content">
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
