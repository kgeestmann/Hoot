<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h3>Hoot</h3>
    </div>

    <nav class="sidebar-nav">
      <a
        class="nav-btn"
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a
        class="nav-btn"
        routerLink="/profile"
        routerLinkActive="active-link"
        *ngIf="auth.isLoggedIn()"
      >
        Profile
      </a>

      <a
        class="nav-btn"
        routerLink="/login"
        routerLinkActive="active-link"
        *ngIf="!auth.isLoggedIn()"
      >
        Login
      </a>
    </nav>

    <div class="logout" *ngIf="auth.isLoggedIn()">
      <button class="nav-btn danger" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <ng-content></ng-content>
  </main>
</div>
