<div
  class="ui-card"
  [class]="'elevation-' + elevation + ' variant-' + variant"
>
  <div class="card-header" *ngIf="title || description">
    <h3 *ngIf="title">{{ title }}</h3>
    <p *ngIf="description">{{ description }}</p>
  </div>
  <div class="card-content">
    <ng-content></ng-content>
  </div>
</div>
