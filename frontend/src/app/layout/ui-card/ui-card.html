<div class="ui-card" [class]="'elevation-' + elevation + ' variant-' + variant">
  @if (title || description) {
    <div class="card-header">
      @if (title) {
        <h3>{{ title }}</h3>
      }
      @if (description) {
        <p>{{ description }}</p>
      }
    </div>
  }
  <div class="card-content">
    <ng-content></ng-content>
  </div>
</div>
