<div class="install-banner" role="status">
  <mat-icon svgIcon="info" />
  <p class="text">
    Hoot can't see any of your repositories yet. Install it on your GitHub account.
  </p>
  <div class="actions">
    <a mat-stroked-button class="install-link" [href]="installUrl()">Install Hoot on GitHub</a>
    <a mat-button routerLink="/github-access">GitHub access</a>
  </div>
</div>
