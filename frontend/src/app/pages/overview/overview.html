<div class="overview-page">
  <h1 class="page-title">Overview</h1>

  @let gitHubAccess = access();
  @if (installedNowhere() && gitHubAccess) {
    <app-github-access [access]="gitHubAccess" />
  } @else {
    @if (visible(); as overview) {
      @if (nothingWaiting()) {
        <p class="all-clear">Nothing waiting on you 🎉</p>
      } @else {
        <app-overview-filters
          [options]="filterOptions()"
          [hiddenCount]="hiddenCount()"
          [saveFailed]="filterSaveFailed()"
          (toggle)="toggleFilter($event)"
        />
        <div class="sections">
          <app-overview-section
            heading="Your pull requests"
            [items]="overview.pull_requests"
            emptyText="You have no open pull requests."
          />
          <app-overview-section
            heading="Review requests"
            [items]="overview.review_requests"
            emptyText="No reviews are waiting on you."
          />
          <app-overview-section
            heading="Assigned issues"
            [items]="overview.assigned_issues"
            emptyText="No open issues are assigned to you."
          />
          <app-overview-section
            heading="Mentions"
            [items]="overview.mentions"
            emptyText="Nobody mentioned you in an open issue or pull request."
          />
        </div>
      }
    } @else if (loadError(); as message) {
      <app-load-error [message]="message" (retry)="load()" />
    } @else {
      <app-sections-skeleton label="Loading your overview" />
    }

    @if (gitHubAccess) {
      <app-github-access [access]="gitHubAccess" />
    }
  }
</div>
