<div class="overview-page">
  @if (overview()) {
    <div class="toolbar">
      @if (showFilters()) {
        <app-filter-bar
          class="filters"
          [owners]="filterOptions().owners"
          [labels]="filterOptions().labels"
          [shownCount]="shownCount()"
          [totalCount]="totalCount()"
          [saveFailed]="filterState.saveFailed()"
          (toggleScope)="filterState.toggleScope($event)"
          (toggleLabel)="filterState.toggleLabel($event)"
          (clear)="filterState.clear()"
        />
      }
      <app-refresh-status
        class="refresh"
        [loadedAt]="loadedAt()"
        [refreshing]="refreshing()"
        [failed]="refreshFailed()"
        (refresh)="refresh()"
      />
    </div>
    @if (nothingWaiting() && !installedNowhere()) {
      <p class="all-clear">
        <mat-icon svgIcon="task_alt" />
        Nothing waiting on you.
      </p>
    }
    <app-list-tabs [tabs]="tabs()" [(selectedIndex)]="selectedTab" />
  } @else if (loadError(); as message) {
    <app-load-error [message]="message" (retry)="load()" />
  } @else {
    <app-list-skeleton label="Loading your overview" />
  }
</div>
