<section class="section">
  @if (heading(); as heading) {
    <h2 class="heading">
      {{ heading }}
      <span class="count">{{ count() }}</span>
    </h2>
  }
  @if (items().length > 0) {
    <mat-nav-list class="items">
      @for (row of rows(); track row.item.url) {
        <a mat-list-item class="item" [href]="row.item.url" [lines]="row.hasChips ? 3 : 2">
          <span matListItemTitle class="title">{{ row.item.title }}</span>
          <span matListItemLine class="meta"><app-item-meta [item]="row.item" /></span>
          @if (row.hasChips) {
            <span matListItemLine class="chips"><app-item-chips [item]="row.item" /></span>
          }
        </a>
      }
    </mat-nav-list>
    @if (hasMore()) {
      <a mat-button class="more-link" [href]="moreUrl()">
        <mat-icon svgIcon="open_in_new" />
        Show all {{ count() }} on GitHub
      </a>
    }
  } @else {
    <p class="empty">{{ emptyText() }}</p>
  }
</section>
