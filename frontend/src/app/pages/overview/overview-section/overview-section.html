<section class="section">
  <h2 class="heading">
    {{ heading() }}
    <span class="count">{{ count() }}</span>
  </h2>
  @if (items().length > 0) {
    <ul class="items">
      @for (item of items(); track item.url) {
        <li><app-overview-item [item]="item" /></li>
      }
    </ul>
    @if (hasMore()) {
      <a mat-button class="more-link" [href]="moreUrl()">Show all {{ count() }} on GitHub</a>
    }
  } @else {
    <p class="empty">{{ emptyText() }}</p>
  }
</section>
