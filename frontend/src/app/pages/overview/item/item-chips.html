<div class="chips">
  @for (status of statuses(); track status.label) {
    <span [class]="'status status-' + status.tone">
      <mat-icon [svgIcon]="status.icon" />
      {{ status.label }}
    </span>
  }
  @if (labels().length > 0) {
    <mat-chip-set aria-label="Labels">
      @for (label of labels(); track label.name) {
        <mat-chip
          class="label"
          disableRipple
          [style.--mat-chip-elevated-container-color]="label.background"
          [style.--mat-chip-label-text-color]="label.text"
        >
          {{ label.name }}
        </mat-chip>
      }
    </mat-chip-set>
  }
</div>
