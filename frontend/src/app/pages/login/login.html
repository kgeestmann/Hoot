<div class="login-page">
  <ui-card
    title="Sign in"
    description="Hoot shows everything that is waiting on you on GitHub."
    elevation="medium"
  >
    <div class="login-content">
      @if (signInFailed) {
        <div class="form-error" role="alert">
          Signing in with GitHub didn't work or was cancelled. Please try again.
        </div>
      }
      <a class="github-button" [href]="signInUrl">Sign in with GitHub</a>
    </div>
  </ui-card>
</div>
