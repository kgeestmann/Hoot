<div class="login-page">
  <mat-card appearance="filled">
    <mat-card-header>
      <mat-icon mat-card-avatar class="logo" svgIcon="hoot" />
      <h2 mat-card-title>Sign in</h2>
      <p mat-card-subtitle>Hoot shows everything that is waiting on you on GitHub.</p>
    </mat-card-header>
    <mat-card-content class="login-content">
      @if (signInFailed) {
        <div class="form-error" role="alert">
          Signing in with GitHub didn't work or was cancelled. Please try again.
        </div>
      }
      <a mat-flat-button class="github-button" [href]="signInUrl">Sign in with GitHub</a>
    </mat-card-content>
  </mat-card>
</div>
