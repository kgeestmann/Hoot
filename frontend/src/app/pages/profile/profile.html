@if (user(); as user) {
  <div class="profile-page">
    <mat-card appearance="filled">
      <mat-card-header>
        <h2 mat-card-title>Profile</h2>
        <p mat-card-subtitle>Your account details.</p>
      </mat-card-header>
      <mat-card-content>
        <mat-list class="profile-fields">
          <mat-list-item>
            <span matListItemLine class="label">ID</span>
            <span matListItemTitle class="value">{{ user.id }}</span>
          </mat-list-item>
          <mat-divider />
          <mat-list-item>
            <span matListItemLine class="label">GitHub account</span>
            <span matListItemTitle class="value">{{ user.login }}</span>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>
  </div>
}
