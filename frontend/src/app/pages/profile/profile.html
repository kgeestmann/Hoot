@if (user(); as user) {
  <div class="profile-page">
    <mat-card appearance="outlined">
      <mat-card-header>
        <h1 mat-card-title>Profile</h1>
        <p mat-card-subtitle>Your account details.</p>
      </mat-card-header>
      <mat-card-content>
        <div class="profile-grid">
          <div class="profile-field">
            <span class="label">ID</span>
            <span class="value">{{ user.id }}</span>
          </div>
          <div class="profile-field">
            <span class="label">GitHub account</span>
            <span class="value">{{ user.login }}</span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
}
