<div class="organization-page">
  <p class="subtitle">
    What needs the team's attention. Lists of work only, no statistics per person.
  </p>
  <ng-template appPageToolbar>
    @if (overview()) {
      <app-refresh-status
        [loadedAt]="loadedAt()"
        [refreshing]="refreshing()"
        [failed]="refreshFailed()"
        (refresh)="refresh()"
      />
    }
  </ng-template>

  @if (overview()) {
    <app-list-tabs [tabs]="tabs()" [(selectedIndex)]="selectedTab" />
  } @else if (loadError(); as message) {
    <app-load-error [message]="message" (retry)="load()" />
  } @else {
    <app-list-skeleton [label]="'Loading the team view of ' + organization()" />
  }
</div>
